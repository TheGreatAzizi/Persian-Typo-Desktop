name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (PyInstaller)
        run: pyinstaller --noconfirm --clean build_windows.spec

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "Persian Typo Fixer" \
            --icon assets/icon.png \
            --add-data "assets/icon.png:assets" \
            --hiddenimport PyQt6.QtWidgets \
            --hiddenimport PyQt6.QtGui \
            --hiddenimport PyQt6.QtCore \
            --hiddenimport pyperclip \
            --hiddenimport pyautogui \
            --hiddenimport pynput \
            --hiddenimport core.fixer \
            --hiddenimport core.clipboard \
            --hiddenimport core.hotkey \
            --hiddenimport ui.settings \
            main.py

      - name: Download appimagetool
        run: |
          wget "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppDir
        run: |
          rm -rf AppDir dist
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/128x128/apps AppDir/usr/share/applications
          cp "dist/Persian Typo Fixer" "AppDir/usr/bin/Persian Typo Fixer"
          cp assets/icon.png "AppDir/usr/share/icons/hicolor/128x128/apps/com.thegreatazizi.persiantypofixer.png"
          cat > AppDir/usr/share/applications/com.thegreatazizi.persiantypofixer.desktop <<'EOF'
          [Desktop Entry]
          Name=Persian Typo Fixer
          Comment=اصلاح خودکار متن فارسی در همه برنامه‌ها
          Exec=AppRun
          Icon=com.thegreatazizi.persiantypofixer
          Terminal=false
          Type=Application
          Categories=Office;Utility;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$HERE/usr/lib/qt6/plugins"
          export QT_PLUGIN_PATH="$HERE/usr/lib/qt6/plugins"
          exec "$HERE/usr/bin/Persian Typo Fixer" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir "Persian Typo Fixer-${GITHUB_REF_NAME#v}-x86_64.AppImage"

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: "Persian Typo Fixer-*-x86_64.AppImage"
