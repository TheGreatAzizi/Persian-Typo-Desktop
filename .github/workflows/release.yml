name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore dotnet/PersianTypoFixer.sln

      - name: Publish Windows executable
        run: |
          dotnet publish dotnet/src/PersianTypoFixer.App/PersianTypoFixer.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/win
          Move-Item dist/win/PersianTypoFixer.exe dist/win/Persian.Typo.Fixer.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/win/Persian.Typo.Fixer.exe

  build-linux:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget file

      - name: Restore
        run: dotnet restore dotnet/PersianTypoFixer.sln

      - name: Publish Linux binary
        run: |
          dotnet publish dotnet/src/PersianTypoFixer.App/PersianTypoFixer.App.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/linux
          chmod +x dist/linux/PersianTypoFixer

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool \
            || wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppDir
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp dist/linux/PersianTypoFixer AppDir/usr/bin/PersianTypoFixer
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/com.thegreatazizi.persiantypofixer.png
          cp assets/icon.png AppDir/com.thegreatazizi.persiantypofixer.png
          cp assets/icon.png AppDir/.DirIcon
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Persian Typo Fixer' \
            'Name[fa]=اصلاح‌گر تایپ فارسی' \
            'Comment=Fix Persian text in any application' \
            'Comment[fa]=اصلاح خودکار متن فارسی در همه برنامه‌ها' \
            'Exec=AppRun %F' \
            'Icon=com.thegreatazizi.persiantypofixer' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Office;Utility;' \
            > AppDir/com.thegreatazizi.persiantypofixer.desktop
          cp AppDir/com.thegreatazizi.persiantypofixer.desktop AppDir/usr/share/applications/com.thegreatazizi.persiantypofixer.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          exec "$HERE/usr/bin/PersianTypoFixer" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir "Persian.Typo.Fixer-${GITHUB_REF_NAME#v}-x86_64.AppImage" \
            || ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Persian.Typo.Fixer-${GITHUB_REF_NAME#v}-x86_64.AppImage"

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: "Persian.Typo.Fixer-*-x86_64.AppImage"
