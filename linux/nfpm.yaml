name: persian-typo-fixer
arch: amd64
platform: linux
version: __VERSION__
release: "1"
section: utils
priority: optional
maintainer: "Mohammad Mehdi Azizi <the.mmazizi@gmail.com>"
vendor: TheGreatAzizi
homepage: https://github.com/TheGreatAzizi/Persian-Typo-Desktop
license: MIT
description: |
  Offline Persian typo fixer that corrects common Persian typing mistakes
  in any application, including ZWNJ, Arabic Yeh/Kaf, compound words,
  digits and punctuation.

contents:
  - src: dist/linux/PersianTypoFixer
    dst: /usr/bin/persian-typo-fixer
    file_info:
      mode: 0755
  - src: linux/com.thegreatazizi.persiantypofixer.desktop
    dst: /usr/share/applications/com.thegreatazizi.persiantypofixer.desktop
    file_info:
      mode: 0644
  - src: linux/com.thegreatazizi.persiantypofixer.appdata.xml
    dst: /usr/share/metainfo/com.thegreatazizi.persiantypofixer.appdata.xml
    file_info:
      mode: 0644
  - src: assets/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/com.thegreatazizi.persiantypofixer.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/persian-typo-fixer/LICENSE
    file_info:
      mode: 0644
  - src: dotnet/src/PersianTypoFixer.App/Assets/Fonts/OFL.txt
    dst: /usr/share/licenses/persian-typo-fixer/OFL.txt
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libx11-6
      - libxrandr2
      - libxi6
      - libxtst6
      - libxcursor1
      - libxext6
      - libxrender1
      - libsm6
      - libice6
      - libfontconfig1
      - libfreetype6
      - libgl1
      - libegl1
      - libglib2.0-0t64 | libglib2.0-0
    recommends:
      - ydotool
      - wl-clipboard
  rpm:
    depends:
      - glibc >= 2.35
      - libgcc_s.so.1()(64bit)
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libXi.so.6()(64bit)
      - libXtst.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXrender.so.1()(64bit)
      - libSM.so.6()(64bit)
      - libICE.so.6()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libglib-2.0.so.0()(64bit)
    recommends:
      - ydotool
      - wl-clipboard
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - zlib
      - libx11
      - libxrandr
      - libxi
      - libxtst
      - libxcursor
      - libxext
      - libxrender
      - libsm
      - libice
      - fontconfig
      - freetype2
      - glib2
      - libglvnd
      - mesa
    recommends:
      - ydotool
      - wl-clipboard
